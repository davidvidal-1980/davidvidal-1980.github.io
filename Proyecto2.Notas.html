<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>CONTROL DE NOTAS</h1>

        <!-- FORMULARIO DE REGISTRO -->
        <section class="tarjeta">
            <h2>Registrar estudiante</h2>

            <form id="formNotas">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Nombre completo" required>

                <label for="nie">NIE:</label>
                <input type="text" id="nie" placeholder="Número de NIE" required>

                <label for="nota1">Nota 1:</label>
                <input type="number" id="nota1" min="0" max="10" step="0.1" required>

                <label for="nota2">Nota 2:</label>
                <input type="number" id="nota2" min="0" max="10" step="0.1" required>

                <label for="nota3">Nota 3:</label>
                <input type="number" id="nota3" min="0" max="10" step="0.1" required>

                <label for="examen">Examen:</label>
                <input type="number" id="examen" min="0" max="10" step="0.1" required>

                <button type="submit">CALCULAR Y GUARDAR</button>

            </form>

            <div id="mensaje"></div>
            <div id="resultado"></div>

        </section>


        <!-- CONSULTAR NOTAS -->
        <section class="tarjeta">

            <h2>CONSULTAR NOTAS</h2>

            <input type="file" id="archivo" accept=".txt">

            <button id="mostrarRegistros" type="button">
                MOSTRAR REGISTROS
            </button>

            <div id="tablaRegistros"></div>

            <div id="estadisticas"></div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
