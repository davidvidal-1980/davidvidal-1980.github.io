<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Registro Estudiantil</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="contenedor">
        <header>
            <div class="icono">🎓</div>
            <h1>REGISTRO ESTUDIANTIL</h1>
            <p>Ingresa tus datos para completar el registro</p>
        </header>

        <form id="formulario">

            <div class="campo">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre"
                       placeholder="Escribe tu nombre completo"
                       required>
            </div>

            <div class="campo">
                <label for="nie">NIE:</label>
                <input type="text" id="nie"
                       placeholder="Ingresa tu NIE"
                       required>
            </div>

            <div class="campo">
                <label for="edad">Edad:</label>
                <input type="number" id="edad"
                       placeholder="Ingresa tu edad"
                       min="1" max="120" required>
            </div>

            <div class="campo">
                <label for="grado">Grado:</label>
                <select id="grado" required>
                    <option value="">Seleccionar grado</option>
                    <option value="7° grado">7° grado</option>
                    <option value="8° grado">8° grado</option>
                    <option value="9° grado">9° grado</option>
                    <option value="1° Bachillerato">1° Bachillerato</option>
                    <option value="2° Bachillerato">2° Bachillerato</option>
                    <option value="3° Bachillerato">3° Bachillerato</option>
                </select>
            </div>

            <div class="campo">
                <label for="seccion">Sección:</label>
                <select id="seccion" required>
                    <option value="">Seleccionar sección</option>
                    <option value="A">Sección A</option>
                    <option value="B">Sección B</option>
                    <option value="C">Sección C</option>
                    <option value="D">Sección D</option>
                </select>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo"
                       placeholder="ejemplo@correo.com"
                       required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono"
                       placeholder="Ingresa tu teléfono"
                       required>
            </div>

            <button type="submit">REGISTRAR ESTUDIANTE</button>

            <p id="mensaje" role="status" aria-live="polite"></p>

        </form>

        <section id="resultado" class="resultado">
            <h2>📋 Datos del estudiante</h2>
            <div id="datos"></div>
        </section>

        <footer>
            <p>Mi Registro Estudiantil © 2026</p>
        </footer>
    </div>

</body>
</html>
